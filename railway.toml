# CP5 — Cấu hình deploy Railway (dùng nếu bạn chọn Railway).
#
# Các biến môi trường KHÔNG khai báo ở đây. Đặt chúng trong dashboard hoặc:
#     railway variables --set API_TOKEN=...
#
# Railway tự gán biến PORT — app phải đọc $PORT, đừng cố định 8000.

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# KHÔNG khai báo startCommand: để Railway dùng luôn CMD trong Dockerfile.
#
# Một nguồn sự thật duy nhất cho lệnh khởi động. CMD đã lo cả hai việc khó —
# đọc $PORT do platform gán, và `exec` để uvicorn thành PID 1 nhận được
# SIGTERM lúc deploy bản mới. Khai lại ở đây là ghi đè CMD và mất cả hai:
# startCommand không chạy qua shell nên `exec` bị hiểu là tên chương trình,
# container chết ngay không kịp ghi một dòng log nào.
healthcheckPath = "/healthz"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
