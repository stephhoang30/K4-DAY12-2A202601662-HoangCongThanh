# CI/CD — mỗi lần push là tự chạy test, tự build image, và CHỈ deploy khi mọi
# thứ đã xanh.
#
# Ba job xếp thành một cái cổng: test → build → deploy. `needs:` là thứ biến nó
# thành cổng thật; thiếu nó thì GitHub chạy cả ba song song và code hỏng vẫn lên
# production trong lúc test đang đỏ.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Mặc định chỉ cho đọc. Không job nào ở đây cần quyền ghi vào repo.
permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Cài dependency
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Chạy test
        # Loại ba nhóm test không chạy được trong CI:
        #   test_cp5.py       — gọi vào bản deploy đang sống, CI không nên phụ
        #                       thuộc vào nó (và deploy chưa xảy ra ở bước này)
        #   test_bonus_cicd.py— kiểm tra badge của chính workflow này; chạy ở
        #                       đây là tự kiểm tra kết quả của chính mình
        #   -m "not docker"   — phần build image đã có job `build` lo
        run: |
          pytest tests/ -v -m "not docker" \
            --ignore=tests/test_cp5.py \
            --ignore=tests/test_bonus_cicd.py

  build:
    name: Build image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t day12-chat:${{ github.sha }} .

      - name: Image phải dưới 400MB
        run: |
          BYTES=$(docker image inspect day12-chat:${{ github.sha }} -f '{{.Size}}')
          MB=$((BYTES / 1024 / 1024))
          echo "Image: ${MB}MB"
          if [ "$MB" -ge 400 ]; then
            echo "::error::Image ${MB}MB vượt trần 400MB — kiểm tra lại multi-stage và base image"
            exit 1
          fi

      - name: Container không được chạy bằng root
        run: |
          UID_TRONG_CONTAINER=$(docker run --rm day12-chat:${{ github.sha }} id -u)
          echo "uid: ${UID_TRONG_CONTAINER}"
          if [ "$UID_TRONG_CONTAINER" = "0" ]; then
            echo "::error::Container đang chạy bằng root — thiếu lệnh USER trong Dockerfile"
            exit 1
          fi

  deploy:
    name: Deploy
    needs: [test, build]
    # Chỉ deploy khi code đã nằm trên main. Mở pull request không được kéo theo
    # một lần deploy — PR là lúc để kiểm tra, không phải lúc để phát hành.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy lên Railway
        env:
          # Token nằm ở Settings → Secrets and variables → Actions, không nằm
          # trong file này. File này công khai cùng repo.
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::warning::Chưa cấu hình secret RAILWAY_TOKEN — bỏ qua bước deploy."
            echo "Thêm token tại Settings → Secrets and variables → Actions để bật auto-deploy."
            exit 0
          fi
          npm install -g @railway/cli
          railway up --service chat --ci
